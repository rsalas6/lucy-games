@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:block;src:url(../vendor/fonts/i7dPIFZ9Zz-WBtRtedDbYEF8RXi4EwQ.woff2) format('woff2')}

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#7cc85a;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:var(--font);touch-action:manipulation;-webkit-touch-callout:none;cursor:pointer;color:var(--ink)}

<style>

<script>
// Pantalla de carga de LUCY GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

const T = 16;
function makeMap(w, h) { return { w, h, ground: new Uint8Array(w * h), solid: new Uint8Array(w * h), objs: [], doors: {}, acts: {} }; }
const G_BRIDGE = 8, G_IWALL = 7, G_GRASS = 0, G_PATH = 1, G_FLOWER = 2, G_WATER = 3, G_FLOOR = 4, G_WALL = 5, G_PLAZA = 6;
function setRect(m, x0, y0, x1, y1, f) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && y >= 0 && x < m.w && y < m.h) f(x + y * m.w, x, y); }
// Objeto: dibujo `img` de `tw` cuadros de ancho, apoyado en (x, yb); bloquea `fw`×`fh` cuadros abajo
function addObj(m, img, x, yb, tw, fw = tw, fh = 1, extra = {}) {
  const o = Object.assign({ img, x, yb, tw, fx: x + Math.floor((tw - fw) / 2), fw, fh }, extra); m.objs.push(o);
  setRect(m, o.fx, yb - fh + 1, o.fx + fw - 1, yb, i => (m.solid[i] = 1)); return o;
}

/* ---------- Acomodar la casa: tocar un mueble guardado para ponerlo, arrastrar para moverlo, arrastrar a la bandeja para guardarlo ---------- */
let editSel = null, panDrag = null;
function setEdit(on) {
  game.edit = on; game.pan = null; panDrag = null; $('#tray').hidden = !on; $('#partyBtn').hidden = on || game.map !== 'home'; document.querySelector('.dock').style.visibility = on ? 'hidden' : ''; editSel = null;
  if (!on) { const m = maps.home; placeFurniture(m); for (const c of [lucy, ...cats]) if (m.solid[c.x + c.y * m.w]) { const p = freeTile(m, c); if (p) { c.x = c.px = p.x; c.y = c.py = p.y; c.path = []; c.on = false; } } persist(); }
  resize(); paintTray(); sfx.tap();
}
function paintTray() {
  const box = $('#trayItems'), cnt = {}; S.home.store.forEach(id => (cnt[id] = (cnt[id] || 0) + 1));
  const ids = Object.keys(cnt);
  box.innerHTML = ids.length ? ids.map(id => `<button data-id="${id}" aria-label="${FURNI[id].n}"><img alt="" src="${src(FURNI[id].img)}">${cnt[id] > 1 ? `<span class="qty">${cnt[id]}</span>` : ''}</button>`).join('') : '<p>Arrastra los muebles para moverlos. Arrástralos aquí abajo para guardarlos. ¡Compra más en la mueblería!</p>';
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => placeFromStore(b.dataset.id)));
}
function placeFromStore(id) {
  const m = maps.home, f = FURNI[id], c = { x: Math.floor(m.w / 2), y: Math.floor(m.h / 2) }; let best = null;
  // Los tapetes van al centro; los muebles, primero contra la pared del fondo
  for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) if (fits(m, f, x, y)) { const d = f.flat ? Math.hypot(x + f.fw / 2 - c.x, y + f.fh / 2 - c.y) : (m.floorT[x + (y - 1) * m.w] ? 6 : 0) + y * .3 + Math.abs(x + f.fw / 2 - c.x) * .45; if (!best || d < best.d) best = { x, y, d }; }
  if (!best) { sfx.no(); toast('Ya no cabe: ¡amplía tu casa en la mueblería!', 'b-home'); return; }
  S.home.store.splice(S.home.store.indexOf(id), 1); S.home.items.push({ id, x: best.x, y: best.y }); if (game.pan) { game.pan.x = (best.x + f.fw / 2) * T - VW / SCALE / 2; game.pan.y = (best.y + f.fh / 2) * T - VH / SCALE / 2; } placeFurniture(m); paintTray(); sfx.pick(); event('place'); checkComfort();
}
function editDown(e) {
  const m = maps.home, fx = e.clientX / SCALE + cam.x, fy = e.clientY / SCALE + cam.y, tx = Math.floor(fx / T), ty = Math.floor(fy / T);
  const hit = S.home.items.filter(it => { const f = FURNI[it.id]; return tx >= it.x && tx < it.x + f.fw && ty >= it.y && ty < it.y + f.fh; }).sort((a, b) => !!FURNI[a.id].flat - !!FURNI[b.id].flat)[0];
  if (hit) { editSel = { it: hit, f: FURNI[hit.id], x: hit.x, y: hit.y, ox: tx - hit.x, oy: ty - hit.y, ok: true }; sfx.pick(); }
  else if (game.pan) panDrag = { x: e.clientX, y: e.clientY, px: game.pan.x, py: game.pan.y };
}
function editMove(e) {
  if (panDrag && game.pan) { game.pan.x = panDrag.px - (e.clientX - panDrag.x) / SCALE; game.pan.y = panDrag.py - (e.clientY - panDrag.y) / SCALE; return; }
  if (!editSel) return;
  // Al arrastrar un mueble cerca de la orilla, la casa se recorre sola
  if (game.pan) { const k = 6 / SCALE; if (e.clientX < 50) game.pan.x -= k; else if (e.clientX > VW - 50) game.pan.x += k; if (e.clientY < 70) game.pan.y -= k; } const m = maps.home, tx = Math.floor((e.clientX / SCALE + cam.x) / T), ty = Math.floor((e.clientY / SCALE + cam.y) / T);
  editSel.x = tx - editSel.ox; editSel.y = ty - editSel.oy; editSel.ok = fits(m, editSel.f, editSel.x, editSel.y, editSel.it);
  editSel.store = e.clientY > $('#tray').getBoundingClientRect().top; $('#tray').classList.toggle('drop', editSel.store);
}
function editUp() {
  if (!editSel) return; const s = editSel, m = maps.home; editSel = null; $('#tray').classList.remove('drop');
  if (s.store) { S.home.items.splice(S.home.items.indexOf(s.it), 1); S.home.store.push(s.it.id); checkComfort(); toast(`${s.f.n} guardado`, s.f.img); sfx.tap(); }
  else if (s.ok && (s.x !== s.it.x || s.y !== s.it.y)) { s.it.x = s.x; s.it.y = s.y; sfx.drop(); event('place'); }
  else if (!s.ok) sfx.no();
  placeFurniture(m); paintTray();
}

  [['npc-a', 26, 19], ['npc-b', 10, 19], ['npc-c', 33, 21], ['npc-d', 22, 27], ['npc-c', 48, 19], ['npc-a', 55, 28], ['npc-d', 28, 43], ['npc-b', 40, 44], ['npc-a', 9, 44], ['npc-d', 51, 33]].forEach(([s, x, y]) => { const n = mkChar(s, x, y); n.speed = 2.2; n.wait = rand(1, 4); npcs.push(n); });
