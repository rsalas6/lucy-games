<style>
/* Layout: el mundo (pueblo o pastelería) en un canvas de pixel art a pantalla completa; arriba monedas, fama y la tarea del momento; abajo a la derecha los botones de bolsa y mejoras. Las tiendas, el recetario y las mejoras salen como ventanas tipo Pokémon. */

<style>

<script>
// Pantalla de carga de LUCY GAMES: dura al menos ~2.6 s; en los juegos 3D espera a que terminen de cargar los modelos
// (la barra muestra el avance real). Tocar la pantalla la salta solo cuando ya no hay nada cargando.
(() => {
  const el = document.getElementById('leonIntro'), bar = el.querySelector('.li-bar i'), t0 = performance.now();
  const MIN = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 2600;
  let gone = false;
  const ready = () => !window.LEON_WAIT || window.LEON_READY;
  const done = () => { if (gone) return; gone = true; bar.style.width = '100%'; setTimeout(() => el.classList.add('out'), 150); setTimeout(() => el.remove(), 700); };
  (function tick() {
    if (gone) return;
    const t = performance.now() - t0, timeP = Math.min(1, t / MIN);
    const p = window.LEON_WAIT ? Math.min(timeP, .1 + .9 * (window.LEON_READY ? 1 : (window.LEON_PROGRESS || 0) * .95)) : timeP;
    bar.style.width = Math.max(6, p * 100) + '%';
    if ((t >= MIN && ready()) || t > 25000) done(); else setTimeout(tick, 100);
  })();
  // El toque que salta la intro no debe llegar a los botones de atrás
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (ready()) done(); });
  ['click', 'pointerup', 'touchend'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
})();
</script>

}
const furnOf = (m, kind) => m.objs.filter(o => o.furn && o.furn.cat === kind).concat((m.rugs || []).filter(r => r.f.cat === kind).map(r => ({ furn: r.f, it: r.it, fx: r.it.x, yb: r.it.y })));

    k.timer -= dt; if (k.timer > 0) continue;
    if (k.wantEat) { k.wantEat = false; const b = furnOf(m, 'eat')[0]; if (b) { const p = findPath(m, k.x, k.y, b.fx, b.yb, true); if (p) { k.path = p; k.state = 'walk'; k.then = () => { k.state = 'eat'; k.timer = 3; floatText(k.x + .5, k.y - .3, '¡ñam!', null, '#ffe066'); }; continue; } } }
    // Gatitos bien comidos: de vez en cuando le traen un regalito a Lucy
    if (game.map === 'home' && bowlLevel() > .3 && Math.random() < .06 && game.t - (k.giftT || -999) > 90) { k.giftT = game.t; const n = 5 + (Math.random() * 11 | 0); addCoins(n); sfx.coin(); floatText(k.px + .5, k.py - .5, `${k.name} te trajo +${n}`, 'coin', '#ffe066'); }
    // Si estaba arriba de un mueble, se baja de un brinco

    const r = Math.random(), goTo = (o, st, dur, onTop) => { const p = findPath(m, k.x, k.y, o.fx, o.yb, true); if (!p) return false; k.path = p; k.state = 'walk'; k.then = () => { if (onTop) { k.x = k.px = o.fx; k.y = k.py = o.yb; k.on = onTop === 'up'; } k.state = st; k.timer = dur; if (st === 'eat') floatText(k.x + .5, k.y - .3, '¡ñam!', null, '#ffe066'); }; return true; };

    else if (r < .52 && furnOf(m, 'play').length) { const o = pick(furnOf(m, 'play')); if (!goTo(o, 'play', rand(3, 5), 'in')) { k.state = 'stretch'; k.timer = 1.5; } }

    winEl.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => { const a = ACCS.find(q => q.id === b.dataset.acc); if (S.accs.includes(a.id)) return; if ((a.star || 1) > starsOf(S.fame)) { sfx.no(); toast(`Se desbloquea con ${a.star} estrellas`, 'heart'); return; } if (S.coins < a.cost) { sfx.no(); toast('Te faltan monedas', 'coin'); return; } S.coins -= a.cost; S.accs.push(a.id); refreshHud(); sfx.buy(); toast(`¡${a.n} para los gatitos! Toca su camita para ponérselo`, 'cat-coco-icon'); draw(); }));
    winEl.querySelectorAll('[data-grow]').forEach(b => b.addEventListener('click', () => { const nx = HOME_SIZES[S.home.lvl + 1]; if (S.coins < nx.cost) { sfx.no(); toast('Te faltan monedas', 'coin'); return; } S.coins -= nx.cost; S.home.lvl++; maps.home = buildHome(); spawnCats(); refreshHud(); sfx.levelup(); toast(`¡Tu casa ahora es una ${nx.n.toLowerCase()}!`, 'b-home'); event('home:lvl'); draw(); }));
    winEl.querySelectorAll('[data-wall]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.wall, w = WALLS[i]; if (!S.home.walls.includes(i)) { if (S.coins < w.cost) { sfx.no(); toast('Te faltan monedas', 'coin'); return; } S.coins -= w.cost; S.home.walls.push(i); sfx.buy(); } S.home.wall = i; homeTiles(); refreshHud(); draw(); }));
    winEl.querySelectorAll('[data-floor]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.floor, f = FLOORS[i]; if (!S.home.floors.includes(i)) { if (S.coins < f.cost) { sfx.no(); toast('Te faltan monedas', 'coin'); return; } S.coins -= f.cost; S.home.floors.push(i); sfx.buy(); } S.home.floor = i; homeTiles(); refreshHud(); draw(); }));
  };
  draw();
}

/* ---------- Pedidos especiales: un vecino encarga varios postres para su fiesta (pagan el doble) ---------- */
const PARTIES = [['npc-d', 'Don Pepe', 'su cumpleaños'], ['npc-a', 'Doña Rosa', 'la merienda con sus amigas'], ['npc-b', 'Toño', 'su fiesta de la escuela'], ['npc-c', 'Mimí', 'su pijamada']];
function newOrder() {
  const menu = REC.filter(unlocked), r = pick(menu), who = pick(PARTIES), n = 2 + (Math.random() * (1 + starsOf(S.fame)) | 0);
  S.order = { r: r.id, n, who: who[0], name: who[1], why: who[2], pay: priceOf(r) * n * 2, fame: r.star * n };
  paintOrder(); sfx.bell(); toast(`¡Pedido de ${who[1]}! ${n} × ${r.n}`, 'des-' + r.id);
}
function paintOrder() { const o = S.order, b = $('#orderBtn'); b.hidden = !o; if (o) { $('#orderImg').src = src('des-' + o.r); b.classList.toggle('pulse', S.show.filter(x => x === o.r).length >= o.n); } }
function openOrder() {
  const o = S.order; if (!o) return; sfx.tap(); const have = S.show.filter(x => x === o.r).length, ok = have >= o.n;
  openWin(`<header><img alt="" src="${portrait(o.who)}"><div style="flex:1"><h2>Pedido de ${o.name}</h2><p>Es para ${o.why}. ¡Paga el doble!</p></div><button class="close" aria-label="Cerrar">✕</button></header><div class="body"><div class="grid"><div class="card"><span class="qty">${have}/${o.n}</span><img class="pic" alt="" src="${src('des-' + o.r)}"><span class="name">${o.n} × ${RECI[o.r].n}</span>${priceTag(o.pay)}<span style="font-size:14px;color:#d0508a">+${o.fame} fama</span></div></div>` +
    `<div style="display:flex;justify-content:center;gap:12px;margin-top:14px"><button class="card" id="deliver" style="min-width:180px;${ok ? 'background:#c8f5dc' : 'opacity:.6'}">${ok ? '¡Entregar!' : 'Hornéalos y ponlos en la vitrina'}</button><button class="card" id="skip" style="min-width:120px">Otro pedido</button></div></div>`);
  $('#deliver').addEventListener('click', () => {
    if (!ok) { sfx.no(); return; }
    for (let i = 0; i < o.n; i++) S.show.splice(S.show.indexOf(o.r), 1);
    addCoins(o.pay); addFame(o.fame); S.order = null; S.orderT = now(); sfx.levelup(); event('order'); closeWin(); paintOrder(); toast(`¡${o.name} está feliz! +${o.pay}`, 'coin');
  });
  $('#skip').addEventListener('click', () => { S.order = null; S.orderT = now() - 60; closeWin(); paintOrder(); });
}

/* ---------- Vecinos del pueblo que pasean ---------- */
function spawnTownNpcs() {
  const m = maps.town; npcs = [];
  [['npc-a', 26, 19], ['npc-b', 10, 19], ['npc-c', 33, 21], ['npc-d', 22, 27]].forEach(([s, x, y]) => { const n = mkChar(s, x, y); n.speed = 2.2; n.wait = rand(1, 4); npcs.push(n); });
  for (const a of m.animals) { a.px = a.x; a.py = a.y; a.wait = rand(1, 3); a.face = 1; }
}
function updateTown(dt) {
  const m = maps.town;
  for (const n of npcs) {
    stepChar(n, dt, m);
    if (!n.moving && !n.path.length) { n.wait -= dt; if (n.wait < 0) { n.wait = rand(2, 6); const tx = clamp(n.x + (Math.random() * 9 | 0) - 4, 2, m.w - 3), ty = clamp(n.y + (Math.random() * 7 | 0) - 3, 2, m.h - 3); const p = findPath(m, n.x, n.y, tx, ty); if (p && p.length < 12) n.path = p; } }
  }
  for (const a of m.animals) {
    if (a.moving) { a.t += dt * 1.5; const k = Math.min(1, a.t); a.px = a.fx + (a.x - a.fx) * k; a.py = a.fy + (a.y - a.fy) * k; if (k >= 1) a.moving = false; continue; }
    a.wait -= dt; if (a.wait < 0) { a.wait = rand(1.5, 4); const [dx, dy] = pick(DIRS), nx = a.x + dx, ny = a.y + dy; if (nx >= a.area[0] && nx <= a.area[2] && ny >= a.area[1] && ny <= a.area[3] && !m.solid[nx + ny * m.w]) { a.fx = a.x; a.fy = a.y; a.x = nx; a.y = ny; a.t = 0; a.moving = true; if (dx) a.face = dx; } }
  }
}
function updateBakery(dt) {
  const m = maps.bakery;
  for (const c of customers) {
    stepChar(c, dt, m);
    if (c.state === 'in' && !c.moving && !c.path.length) { c.state = 'wait'; c.dir = 3; c.since = game.t; }
    if (c.state === 'wait' && game.t - c.since > c.patience) { leave(c, true); }
    if (c.state === 'leave' && !c.moving && !c.path.length) c.gone = true;
  }
  customers = customers.filter(c => !c.gone);
}

/* ---------- Bucle principal ---------- */
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (game) {
    update(dt);
    render();
    // Fundido a blanco al entrar o salir (por reloj, no por cuadros)
    if (fadeT0) { const f = (t - fadeT0) / 300, a = f < 1 ? f : 2 - f; if (f >= 1 && fadeCb) { fadeCb(); fadeCb = null; } if (f >= 2) fadeT0 = 0; cx.fillStyle = `rgba(255,255,255,${clamp(a, 0, 1)})`; cx.fillRect(0, 0, VW, VH); }
  }
  requestAnimationFrame(loop);
}
function update(dt) {
  if (!game) return;
  floaters.forEach(f => (f.t += dt));
  {
    if (game.edit) { updateCats(dt); return; }
    if (!game.paused) {
      game.t += dt;
      joystick();
      stepChar(lucy, dt, mapOf(), c => {
        const m = mapOf(), di = c.x + c.y * m.w; if (m.doors[di]) { const to = m.doors[di]; if (to.startsWith('shop:')) { c.x = c.px = c.x; c.y = c.py = c.y + 1; } enter(to); return; }
        if (!c.path.length && c.goal) arrive();
      });
      if (lucy.moving && Math.random() < dt * 4) sfx.step();
      updateTown(dt); updateBakery(dt); staffWork(dt); unloadOvens(); updateCats(dt);
      // Llegan clientes (más seguido con más estrellas y mesitas)
      if (!S.order && now() - (S.orderT || 0) > 150 && S.sold >= 3) newOrder();
      if (Math.random() < dt) paintOrder();
      if (!customers.length) { game.custT -= dt; if (game.custT <= 0) { game.custT = custInterval() * rand(.6, 1); spawnCustomer(); } }
    }
  }
}

/* ---------- Arranque ---------- */
function paintMute() { $('#muteBtn').innerHTML = muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { muted = !muted; S.muted = muted; persist(); paintMute(); sfx.tap(); });
$('#bagBtn').addEventListener('click', openBag);
$('#orderBtn').addEventListener('click', openOrder);
$('#upBtn').addEventListener('click', openUpgrades);
$('#editBtn').addEventListener('click', () => setEdit(true));
$('#doneBtn').addEventListener('click', () => setEdit(false));
$('#task').addEventListener('click', () => { sfx.tap(); const t = curTask(); toast(t.t, t.img); });
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { persist(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());
paintMute();
(async () => {
  const bar = $('#loading i');
  await loadAll(p => { bar.style.width = Math.max(8, p * 100) + '%'; window.LEON_PROGRESS = p; });
  $('#loading').hidden = true;
  game = { map: ['bakery', 'home'].includes(S.map) ? S.map : 'town', t: 0, paused: false, custT: 8 };
  furnishBakery(); spawnStaff(); spawnTownNpcs(); spawnCats(); decorateTown(); updateDock();
  const sp = S.pos && game.map === 'town' ? S.pos : maps[game.map].spawn; lucy = mkChar(sheetOf(S.outfit || 'lucy'), sp.x, sp.y);
  setInterval(() => { if (game) { S.map = game.map; S.pos = { x: lucy.x, y: lucy.y }; } }, 2000);
  resize(); render.snap = true; refreshHud(); paintTask(); paintOrder(); requestAnimationFrame(loop);
  // Mientras no estaba: el panadero saca lo horneado y la cajera vende lo de la vitrina
  if (S.seen && now() - S.seen > 60) {
    const away = Math.min(4 * 3600, now() - S.seen); let sold = 0, earned = 0, fameUp = 0;
    S.ovens.forEach((o, k) => { if (o && now() - o.start >= o.dur && S.show.length < showCap()) { S.show.push(o.r); if (S.ups.trays && S.show.length < showCap()) S.show.push(o.r); S.ovens[k] = null; } });
    if (S.ups.cashier) { const n = Math.min(S.show.length, Math.floor(away / custInterval())); for (let i = 0; i < n; i++) { const r = RECI[S.show.shift()]; earned += priceOf(r) + (S.ups.coffee ? 5 : 0); fameUp += r.star; sold++; } }
    if (sold) {
      S.coins += earned; S.sold += sold; S.fame += fameUp; refreshHud();
      setTimeout(() => { openWin(head('ch-cashier' in IMG ? 'coin' : 'coin', '¡Bienvenida otra vez!', 'Mientras no estabas…') + `<div class="body"><div class="grid"><div class="card"><img class="pic" alt="" src="${portrait('cashier')}"><span class="name">Sofi vendió ${sold} postre${sold > 1 ? 's' : ''}</span>${priceTag(earned)}<span style="font-size:14px;color:#d0508a">+${fameUp} fama</span></div></div></div>`); sfx.coin(); }, 900);
    }
  }
  S.seen = now();
  // Diagnóstico (solo pruebas): #diag juega un poco solo y manda fotos a un servidor local
  if (location.hash === '#diag') (async () => {
    const errs = []; addEventListener('error', e => errs.push(e.message));
    const post = (tag, extra) => fetch('http://127.0.0.1:8799/', { method: 'POST', body: JSON.stringify({ tag, img: cv.toDataURL('image/png'), info: Object.assign({ ua: navigator.userAgent, errs, map: game.map, coins: S.coins }, extra || {}) }) });
    const step = n => { for (let i = 0; i < n; i++) update(1 / 30); render(); };
    step(30); post('lucy-town');
    tapAt({ clientX: ((14 + .5) * T - cam.x) * SCALE, clientY: ((8 + .5) * T - cam.y) * SCALE }); for (let i = 0; i < 80 && modal.hidden; i++) step(5);
    post('lucy-shop', { shop: !modal.hidden }); closeWin();
    game.map = 'bakery'; resize(); S.inv.flour = 3; S.inv.egg = 3; S.inv.sugar = 3; S.ovens = [{ r: 'cookie', start: now() - 99, dur: 12 }];
    spawnCustomer(); step(60); spawnCustomer(); step(120); post('lucy-bakery', { cust: customers.length });
    game.map = 'home'; resize(); render.snap = true; step(90); post('lucy-home', { cats: cats.map(k => k.state) });
    setEdit(true); step(5); post('lucy-edit', { store: S.home.store.length }); setEdit(false);
    S.coins = 3000; S.home.store.push('yarn', 'tunnel'); setEdit(true); placeFromStore('yarn'); placeFromStore('tunnel'); setEdit(false);
    let plays = 0; for (let i = 0; i < 600 && !plays; i++) { update(1 / 10); if (cats.some(k => k.state === 'play')) plays++; } render(); post('lucy-toys', { plays, items: S.home.items.length });
    game.map = 'town'; resize(); openBoutique(); winEl.querySelector('[data-o=gatita]').click(); closeWin(); render.snap = true; step(10); post('lucy-outfit', { outfit: S.outfit, sheet: lucy.sheet });
    // Huerto, croquetas, pedido especial y adornos del pueblo
    S.home.store.push('berrypot'); setEdit(true); placeFromStore('berrypot'); setEdit(false); const pot = S.home.items.find(i => i.id === 'berrypot'); pot.g = 0; const st0 = S.inv.strawberry || 0; useFurn(FURNI.berrypot, pot);
    S.inv.catfood = 1; S.bowlT = now() - 5000; fillBowl();
    S.order = null; S.orderT = 0; S.sold = Math.max(S.sold, 3); newOrder(); S.show = Array(S.order.n).fill(S.order.r); const c0 = S.coins; openOrder(); $('#deliver').click();
    S.ups['t-fountain'] = 1; S.ups['t-lamps'] = 1; decorateTown();
    game.map = 'town'; lucy.x = lucy.px = 21; lucy.y = lucy.py = 15; resize(); render.snap = true; step(10);
    S.accs = ['crown', 'bow']; S.catAcc = { aceituna: 'crown', coco: 'bow' }; game.map = 'home'; resize(); for (const k of cats) { k.state = 'sit'; k.timer = 99; k.path = []; } step(3); post('lucy-accs', { catAcc: S.catAcc }); game.map = 'town'; resize(); step(3);
    post('lucy-new', { harvest: (S.inv.strawberry || 0) - st0, bowl: bowlLevel(), ordered: S.coins - c0, order: S.order });
    S.recipes = []; S.fame = Math.max(S.fame, 80); openUpgrades(); winEl.querySelector('.tab[data-t=recetas]').click(); winEl.querySelector('[data-u="rec:concha"]').click(); closeWin(); post('lucy-recipe', { recipes: S.recipes, menuHas: REC.filter(unlocked).some(r => r.id === 'concha') });
  })();
  if (!S.welcomed) { S.welcomed = 1; setTimeout(() => toast('¡Bienvenida a tu pastelería, Lucy!', 'des-cupcake'), 600); }
  window.LEON_READY = true;
})();
window.__bake = { get S() { return S; }, get game() { return game; }, get lucy() { return lucy; }, maps, enter, openRecipes, openShop, openUpgrades, startMix, takeOut, serve, spawnCustomer, get customers() { return customers; }, findPath, arrive, tapAt, render, furnish: () => { furnishBakery(); spawnStaff(); }, get cats() { return cats; }, toScreen: (x, y) => ({ clientX: ((x + .5) * T - cam.x) * SCALE, clientY: ((y + .5) * T - cam.y) * SCALE }), step: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) update(dt); render(); } };
})();
</script>
