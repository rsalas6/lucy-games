    // Remolino de la mezcla
    if (phase === 'stir') { mcx.strokeStyle = 'rgba(255,255,255,.7)'; mcx.lineWidth = 6; for (let k = 0; k < 3; k++) { mcx.beginPath(); mcx.ellipse(260, 300, 40 + k * 45, 12 + k * 11, 0, ang + k, ang + k + 2.2); mcx.stroke(); }
      const bx = 260 + Math.cos(ang) * 120, by = 300 + Math.sin(ang) * 30; mcx.strokeStyle = '#a0a8b8'; mcx.lineWidth = 10; mcx.beginPath(); mcx.moveTo(bx, by); mcx.lineTo(bx + 40, by - 200); mcx.stroke(); mcx.strokeStyle = '#4a2a4a'; mcx.lineWidth = 4; mcx.beginPath(); mcx.ellipse(bx, by - 20, 22, 34, 0, 0, Math.PI * 2); mcx.stroke(); }
    // Ingredientes cayendo
    for (const d of dropped) { d.t = Math.min(1, d.t + .05); if (d.t < 1) { const im = IMG['ing-' + d.k]; if (im) mcx.drawImage(im, 260 + d.x - 45, 40 + d.t * 230 - 45, 90, 90); } }
    // Avance del batido
    if (phase === 'stir') { const p = Math.min(1, stir / need); mcx.fillStyle = '#4a2a4a'; mcx.fillRect(110, 470, 300, 26); mcx.fillStyle = '#ff8fc4'; mcx.fillRect(114, 474, 292 * p, 18);
      if (p < .05) { mcx.fillStyle = '#fff'; mcx.font = '30px Lilita One'; mcx.textAlign = 'center'; mcx.lineWidth = 6; mcx.strokeStyle = '#4a2a4a'; const hx = 260 + Math.cos(performance.now() / 300) * 130, hy = 300 + Math.sin(performance.now() / 300) * 35; mcx.beginPath(); mcx.arc(hx, hy, 18, 0, 7); mcx.fillStyle = 'rgba(255,255,255,.8)'; mcx.fill(); mcx.stroke(); }
      if (p >= 1) { done = true; sfx.ding(); toOven(r, slot); return; } }
    requestAnimationFrame(frame);
  })();
}
function toOven(r, slot) {
  Object.entries(r.need).forEach(([k, n]) => (S.inv[k] -= n));
  S.ovens[slot] = { r: r.id, start: now(), dur: r.bake * bakeMul() }; sfx.oven();
  $('#mixTitle').textContent = '¡AL HORNO!'; setTimeout(() => { mix.hidden = true; game.paused = false; toast(`${r.n} en el horno`, 'des-' + r.id); }, 700);
}
// Sacar del horno y decorar con un toque
function takeOut(k, auto = false) {
  const ov = S.ovens[k]; if (!ov || now() - ov.start < ov.dur) { if (!auto) { const left = Math.ceil(ov ? ov.dur - (now() - ov.start) : 0); toast(ov ? `Faltan ${left} segundos` : 'El horno está vacío', ov ? 'des-' + ov.r : 'f-oven1'); } return; }
  if (S.show.length >= showCap()) { if (!auto) { sfx.no(); toast('La vitrina está llena: ¡vende primero!', 'f-vitrina'); } return; }
  S.ovens[k] = null; const r = RECI[ov.r];
  if (auto) { S.show.push(r.id); event('bake:' + r.id); return; }
  game.paused = true; mix.hidden = false; $('#mixTitle').textContent = '¡DECÓRALO!';
  const row = $('#mixRow'); row.innerHTML = '';
  const tops = [['sprinkles', 'Chispas'], ['cream', 'Crema'], ['strawberry', 'Fresas']];
  let bits = [], picked = false;
  tops.forEach(([k]) => { const b = document.createElement('button'); b.innerHTML = `<img alt="" src="${src('ing-' + k)}">`; b.addEventListener('click', () => { if (picked) return; picked = true; sfx.happy(); for (let i = 0; i < 40; i++) bits.push({ k, x: rand(-140, 140), y: rand(-260, -40), vy: rand(4, 9), s: rand(.25, .45) }); setTimeout(() => { mix.hidden = true; game.paused = false; S.show.push(r.id); addFame(1); event('bake:' + r.id); toast(`¡${r.n} a la vitrina!`, 'des-' + r.id); }, 1300); }); row.appendChild(b); });
  (function frame() {
    if (mix.hidden) return; mcx.clearRect(0, 0, 520, 520);
    mcx.fillStyle = '#fff'; mcx.beginPath(); mcx.ellipse(260, 380, 220, 60, 0, 0, Math.PI * 2); mcx.fill(); mcx.strokeStyle = '#4a2a4a'; mcx.lineWidth = 6; mcx.stroke();
    const im = IMG['des-' + r.id]; if (im) mcx.drawImage(im, 90, 60, 340, 340);
    for (const b of bits) { b.y = Math.min(b.y + b.vy, 200 + Math.abs(b.x) * .3); const ii = IMG['ing-' + b.k]; if (ii) mcx.drawImage(ii, 260 + b.x - 40 * b.s, 200 + b.y - 40 * b.s, 80 * b.s, 80 * b.s); }
    requestAnimationFrame(frame);
  })();
}

/* ---------- Clientes ---------- */
const CUST_SHEETS = ['npc-a', 'npc-b', 'npc-c', 'npc-d'];
function custInterval() { const st = starsOf(S.fame); return Math.max(7, 22 - st * 2.5 - (S.ups.table1 ? 3 : 0) - (S.ups.table2 ? 3 : 0)); }
function spawnCustomer() {
  const m = maps.bakery; if (customers.length >= m.queue.length) return;
  const st = starsOf(S.fame), menu = REC.filter(r => r.star <= st), inShow = S.show.filter(r => menu.some(x => x.id === r));
  const want = inShow.length && Math.random() < .75 ? pick(inShow) : pick(menu).id;
  const c = mkChar(pick(CUST_SHEETS), m.door.x, m.door.y); c.want = want; c.state = 'in'; c.since = game.t; c.patience = 70; c.speed = 3; c.dir = 3;
  customers.push(c); assignQueue(); if (game.map === 'bakery') sfx.bell();
  else if (!S.ups.cashier) toast('¡Llegó un cliente a tu pastelería!', 'des-' + want);
}
function assignQueue() { const m = maps.bakery; customers.filter(c => c.state !== 'leave').forEach((c, i) => { const q = m.queue[i]; if (q && (c.qx !== q.x || c.qy !== q.y)) { c.qx = q.x; c.qy = q.y; c.path = findPath(m, c.x, c.y, q.x, q.y) || []; } }); }
// Atender: si hay en la vitrina lo que quiere, paga (y deja propina si lo decoraste)
function serve(c, byStaff = false) {
  const i = S.show.indexOf(c.want); if (i < 0) { if (!byStaff) { sfx.no(); toast(`Quiere ${RECI[c.want].n.toLowerCase()}: hornéalo primero`, 'des-' + c.want); } return false; }
  S.show.splice(i, 1); const r = RECI[c.want], pay = r.price; addCoins(pay); addFame(r.star); S.sold++; sfx.coin();
  floatText(c.px + .5, c.py - 1, '+' + pay, 'coin', '#ffe066'); event('sell');
  leave(c); return true;
}
function leave(c, sad = false) { const m = maps.bakery; c.state = 'leave'; c.want = sad ? null : null; c.path = findPath(m, c.x, c.y, m.door.x, m.door.y) || []; c.sad = sad; assignQueue(); }

/* ---------- Empleados ---------- */
function spawnStaff() {
  staffEls = []; const m = maps.bakery;
  if (S.ups.cashier) { const c = mkChar('cashier', m.behind.x, m.behind.y); c.dir = 0; c.role = 'cashier'; staffEls.push(c); }
  if (S.ups.baker) { const c = mkChar('baker', 9, 5); c.dir = 3; c.role = 'baker'; c.cd = 3; staffEls.push(c); }
  if (S.ups.helper) { const c = mkChar('helper', 12, 9); c.dir = 1; c.role = 'helper'; c.cd = 10; staffEls.push(c); }
}
function staffWork(dt) {
  for (const s of staffEls) {
    s.cd = (s.cd || 0) - dt;
    if (s.role === 'cashier' && s.cd <= 0) { const c = customers.find(c => c.state === 'wait' && S.show.includes(c.want)); if (c) { serve(c, true); s.cd = 2.5; } }
    if (s.role === 'baker' && s.cd <= 0) {
      s.cd = 4;
      // Saca lo que esté listo y mete lo que se pueda hornear (lo más caro primero)
      S.ovens.forEach((o, k) => o && now() - o.start >= o.dur && S.show.length < showCap() && takeOut(k, true));
      const slot = freeOven(), st = starsOf(S.fame);
      if (slot >= 0 && S.show.length + S.ovens.filter(Boolean).length < showCap()) { const r = REC.filter(r => r.star <= st && canMake(r)).sort((a, b) => b.price - a.price)[0]; if (r) { Object.entries(r.need).forEach(([k, n]) => (S.inv[k] -= n)); S.ovens[slot] = { r: r.id, start: now(), dur: r.bake * bakeMul() * 1.3 }; } }
    }
    if (s.role === 'helper' && s.cd <= 0) {
      s.cd = 12;
      // Compra lo que falte para la receta más barata que no se puede hacer
      const st = starsOf(S.fame), r = REC.filter(r => r.star <= st).find(r => !canMake(r));
      if (r) { let spent = 0; for (const [k, n] of Object.entries(r.need)) { const miss = n - (S.inv[k] || 0); if (miss > 0 && S.coins - spent >= ING[k].p * miss + 10) { spent += ING[k].p * miss; S.inv[k] = (S.inv[k] || 0) + miss; } } if (spent) { S.coins -= spent; refreshHud(); if (game.map === 'bakery') floatText(s.px + .5, s.py - 1, '-' + spent, 'coin', '#ffb0b0'); } }
    }
  }
}

/* ---------- Cambiar de mapa ---------- */
function enter(to) {
  if (to.startsWith('shop:')) { openShop(to.slice(5)); const m = maps.town; lucy.path = []; lucy.dir = 0; const d = findPath(m, lucy.x, lucy.y, lucy.x, lucy.y + 1); return; }
  sfx.door(); fade(() => {
    if (to === 'bakery') { game.map = 'bakery'; const m = maps.bakery; lucy.x = lucy.px = m.spawn.x; lucy.y = lucy.py = m.spawn.y; lucy.dir = 3; }
    else { game.map = 'town'; lucy.x = lucy.px = 21; lucy.y = lucy.py = 13; lucy.dir = 0; }
    lucy.path = []; lucy.moving = false; resize();
  });
}
let fadeT0 = 0, fadeCb = null;
function fade(cb) { fadeT0 = performance.now(); fadeCb = cb; }

/* ---------- Dedo: tocar para caminar o para usar algo ---------- */
let drag = null;
function worldTile(e) { return { x: Math.floor((e.clientX / SCALE + cam.x) / T), y: Math.floor((e.clientY / SCALE + cam.y) / T), fx: e.clientX / SCALE + cam.x, fy: e.clientY / SCALE + cam.y }; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); drag = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 28) { drag.moved = true; drag.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0); }
});
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, e => { if (!drag || e.pointerId !== drag.id) return; const d = drag; drag = null; if (!d.moved && ev === 'pointerup') tapAt(e); }));
// Mantener el dedo arrastrado: camina en esa dirección como con la cruceta
function joystick() {
  if (!drag || !drag.moved || game.paused || lucy.moving) return;
  const [dx, dy] = DIRS[drag.dir], m = mapOf(), nx = lucy.x + dx, ny = lucy.y + dy, di = nx + ny * m.w;
  lucy.dir = drag.dir; if (!blocked(m, nx, ny) || m.doors[di]) lucy.path = [{ x: nx, y: ny }]; lucy.goal = null;
}
function tapAt(e) {
  if (game.paused) return; const w = worldTile(e), m = mapOf();
  // ¿Tocó algo con qué hacer algo? (objeto, animal, cliente o personaje)
  const target = findTarget(w, m);
  if (target) { const p = target.door ? findPath(m, lucy.x, lucy.y, target.x, target.y) : findPath(m, lucy.x, lucy.y, target.x, target.y, true); if (p) { lucy.path = p; lucy.goal = target; sfx.tap(); if (!p.length) arrive(); } else sfx.no(); return; }
  const p = findPath(m, lucy.x, lucy.y, clamp(w.x, 0, m.w - 1), clamp(w.y, 0, m.h - 1)); if (p) { lucy.path = p; lucy.goal = null; }
}
function findTarget(w, m) {
  const di = w.x + w.y * m.w; if (m.doors[di]) return { door: m.doors[di], x: w.x, y: w.y };
  if (game.map === 'town') {
    for (const a of m.animals) if (Math.abs(a.x - w.x) <= (a.big ? 1 : 0) && Math.abs(a.y - w.y) <= 1) return { animal: a, x: a.x, y: a.y };
    // Tocar un edificio = ir a su puerta
    for (const o of m.objs) { if (!o.img.startsWith('b-')) continue; const im = IMG[o.img], h = im && im.width ? o.tw * im.height / im.width : 5; if (w.fx >= o.x * T && w.fx < (o.x + o.tw) * T && w.fy > (o.yb + 1 - h) * T && w.fy < (o.yb + 1) * T) { const d = Object.entries(m.doors).find(([i]) => (i % m.w) >= o.x && (i % m.w) < o.x + o.tw && Math.floor(i / m.w) === o.yb); if (d) return { door: d[1], x: d[0] % m.w, y: Math.floor(d[0] / m.w) }; } }
    for (const o of m.objs) if (o.gather && w.x >= o.fx - 1 && w.x <= o.fx + o.fw && w.y >= o.yb - 1 && w.y <= o.yb) return { obj: o, x: o.fx, y: o.yb };
    for (const n of npcs) if (n.x === w.x && (n.y === w.y || n.y === w.y + 1)) return { npc: n, x: n.x, y: n.y };
  } else {
    for (const c of customers) if (c.state === 'wait' && c.x === w.x && (c.y === w.y || c.y === w.y + 1)) return { cust: c, x: m.counter.fx + 1, y: m.counter.yb - 1, stand: true };
    for (const o of m.objs) { if (!o.act) continue; const im = IMG[o.img], h = im && im.width ? o.tw * im.height / im.width : 2; if (w.fx >= o.x * T && w.fx < (o.x + o.tw) * T && w.fy > (o.yb + 1 - h) * T && w.fy < (o.yb + 1) * T) return o.act === 'counter' ? { obj: o, x: o.fx + 1, y: o.yb - 1, stand: true } : { obj: o, x: o.fx, y: o.yb }; }
  }
  return null;
}
// Al llegar junto a lo que tocó: lo usa
function arrive() {
  const g = lucy.goal; if (!g) return; lucy.goal = null;
  if (g.door) return;
  const look = (x, y) => { const dx = x - lucy.x, dy = y - lucy.y; if (dx || dy) lucy.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0); };
  if (g.animal) { look(g.animal.x, g.animal.y); gather({ ...g.animal, px: g.animal.x, py: g.animal.y }); return; }
  if (g.npc) { look(g.npc.x, g.npc.y); sfx.tap(); toast(pick(['¡Hola, Lucy!', '¡Me encantan tus pasteles!', '¡Qué rico huele tu pastelería!', 'Las fresas de aquí son las mejores', '¿Ya probaste hacer pay de manzana?']), null); return; }
  if (g.cust) { lucy.dir = 0; serve(g.cust); return; }
  const o = g.obj; if (!o) return; look(o.fx + (o.fw > 1 ? 1 : 0), o.yb);
  if (o.gather) return gather({ ...o, px: o.fx, py: o.yb });
  if (o.act === 'mix') return openRecipes();
  if (o.act === 'oven') return takeOut(o.k);
  if (o.act === 'show') return openBag();
  if (o.act === 'counter') { lucy.dir = 0; const c = customers.find(c => c.state === 'wait'); if (c) serve(c); else toast('No hay clientes esperando', 'f-counter'); return; }
}

/* ---------- Vecinos del pueblo que pasean ---------- */
function spawnTownNpcs() {
  const m = maps.town; npcs = [];
  [['npc-a', 26, 19], ['npc-b', 10, 19], ['npc-c', 33, 21], ['npc-d', 22, 27]].forEach(([s, x, y]) => { const n = mkChar(s, x, y); n.speed = 2.2; n.wait = rand(1, 4); npcs.push(n); });
  for (const a of m.animals) { a.px = a.x; a.py = a.y; a.wait = rand(1, 3); a.face = 1; }
}
function updateTown(dt) {
  const m = maps.town;
  for (const n of npcs) {
    stepChar(n, dt, m);
    if (!n.moving && !n.path.length) { n.wait -= dt; if (n.wait < 0) { n.wait = rand(2, 6); const tx = clamp(n.x + (Math.random() * 9 | 0) - 4, 2, m.w - 3), ty = clamp(n.y + (Math.random() * 7 | 0) - 3, 2, m.h - 3); const p = findPath(m, n.x, n.y, tx, ty); if (p && p.length < 12) n.path = p; } }
  }
  for (const a of m.animals) {
    if (a.moving) { a.t += dt * 1.5; const k = Math.min(1, a.t); a.px = a.fx + (a.x - a.fx) * k; a.py = a.fy + (a.y - a.fy) * k; if (k >= 1) a.moving = false; continue; }
    a.wait -= dt; if (a.wait < 0) { a.wait = rand(1.5, 4); const [dx, dy] = pick(DIRS), nx = a.x + dx, ny = a.y + dy; if (nx >= a.area[0] && nx <= a.area[2] && ny >= a.area[1] && ny <= a.area[3] && !m.solid[nx + ny * m.w]) { a.fx = a.x; a.fy = a.y; a.x = nx; a.y = ny; a.t = 0; a.moving = true; if (dx) a.face = dx; } }
  }
}
function updateBakery(dt) {
  const m = maps.bakery;
  for (const c of customers) {
    stepChar(c, dt, m);
    if (c.state === 'in' && !c.moving && !c.path.length) { c.state = 'wait'; c.dir = 3; c.since = game.t; }
    if (c.state === 'wait' && game.t - c.since > c.patience) { leave(c, true); }
    if (c.state === 'leave' && !c.moving && !c.path.length) c.gone = true;
  }
  customers = customers.filter(c => !c.gone);
}

/* ---------- Bucle principal ---------- */
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (game) {
    if (!game.paused) {
      game.t += dt;
      joystick();
      stepChar(lucy, dt, mapOf(), c => {
        const m = mapOf(), di = c.x + c.y * m.w; if (m.doors[di]) { const to = m.doors[di]; if (to.startsWith('shop:')) { c.x = c.px = c.x; c.y = c.py = c.y + 1; } enter(to); return; }
        if (!c.path.length && c.goal) arrive();
      });
      if (lucy.moving && Math.random() < dt * 4) sfx.step();
      updateTown(dt); updateBakery(dt); staffWork(dt);
      // Llegan clientes (más seguido con más estrellas y mesitas)
      game.custT -= dt; if (game.custT <= 0) { game.custT = custInterval() * rand(.8, 1.2); spawnCustomer(); }
    }
    render();
    // Fundido a blanco al entrar o salir (por reloj, no por cuadros)
    if (fadeT0) { const f = (t - fadeT0) / 300, a = f < 1 ? f : 2 - f; if (f >= 1 && fadeCb) { fadeCb(); fadeCb = null; } if (f >= 2) fadeT0 = 0; cx.fillStyle = `rgba(255,255,255,${clamp(a, 0, 1)})`; cx.fillRect(0, 0, VW, VH); }
  }
  requestAnimationFrame(loop);
}

/* ---------- Arranque ---------- */
function paintMute() { $('#muteBtn').innerHTML = muted ? ICON_OFF : ICON_ON; }
$('#muteBtn').addEventListener('click', () => { muted = !muted; S.muted = muted; persist(); paintMute(); sfx.tap(); });
$('#bagBtn').addEventListener('click', openBag);
$('#upBtn').addEventListener('click', openUpgrades);
$('#task').addEventListener('click', () => { sfx.tap(); const t = curTask(); toast(t.t, t.img); });
if (window.LEON_HUB) { const b = $('#homeBtn'); b.hidden = false; b.addEventListener('click', () => { persist(); location.href = window.LEON_HUB; }); }
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('contextmenu', e => e.preventDefault());
paintMute();
(async () => {
  const bar = $('#loading i');
  await loadAll(p => { bar.style.width = Math.max(8, p * 100) + '%'; window.LEON_PROGRESS = p; });
  $('#loading').hidden = true;
  game = { map: S.map === 'bakery' ? 'bakery' : 'town', t: 0, paused: false, custT: 8 };
  furnishBakery(); spawnStaff(); spawnTownNpcs();
  const sp = S.pos && game.map === 'town' ? S.pos : maps[game.map].spawn; lucy = mkChar('lucy', sp.x, sp.y);
  setInterval(() => { if (game) { S.map = game.map; S.pos = { x: lucy.x, y: lucy.y }; } }, 2000);
  resize(); refreshHud(); paintTask(); requestAnimationFrame(loop);
  if (!S.welcomed) { S.welcomed = 1; setTimeout(() => toast('¡Bienvenida a tu pastelería, Lucy!', 'des-cupcake'), 600); }
  window.LEON_READY = true;
})();
window.__bake = { get S() { return S; }, get game() { return game; }, get lucy() { return lucy; }, maps, enter, openRecipes, openShop, openUpgrades, startMix, takeOut, serve, spawnCustomer, get customers() { return customers; }, findPath, arrive, tapAt, render, loop: dt => { lastT -= dt * 1000; } };
})();
</script>
